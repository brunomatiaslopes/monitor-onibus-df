name: Monitor de ônibus DF

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que deseja executar?"
        required: true
        default: "testar_fonte"
        type: choice
        options:
          - testar_telegram
          - testar_fonte
          - monitorar_agora

  schedule:
    - cron: "50 15 * * 1-5"
      timezone: "America/Sao_Paulo"

permissions:
  contents: read

concurrency:
  group: monitor-onibus-df
  cancel-in-progress: true

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'testar_telegram' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python monitor_onibus.py --test-telegram

      - name: Testar fonte em tempo real
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'testar_fonte' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python monitor_onibus.py --test-source

      - name: Monitorar agora por uma hora
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'monitorar_agora' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python monitor_onibus.py --force-minutes 60

      - name: Monitoramento diário
        if: ${{ github.event_name == 'schedule' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python monitor_onibus.py
